name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            You are reviewing a pull request for the **Beutel** project — a non-custodial Bitcoin wallet monorepo.

            Structure:
            - `backend/` — Go proxy server (Fiber v2). Tests run with `make test-race`. Never trust user input without validation.
            - `mobile/` — React Native app (Expo, TypeScript, NativeWind). Package manager: pnpm. Keys never leave the device.

            Review the changes in this PR for:
            1. **Correctness** — logic errors, edge cases, off-by-one errors
            2. **Security** — injection risks, key/secret exposure, OWASP Top 10, Bitcoin-specific pitfalls (e.g. amount overflow, UTXO handling)
            3. **Performance** — unnecessary allocations, N+1 queries, blocking calls
            4. **Test coverage** — are new code paths tested? Backend must pass `make test-race`
            5. **Architecture** — does it fit the existing patterns in `internal/api/`, `internal/chain/`, `mobile/src/store/`, `mobile/src/services/`?

            Be concise and actionable. Group findings by severity: Critical / Warning / Suggestion.
            If everything looks good, say so briefly.
